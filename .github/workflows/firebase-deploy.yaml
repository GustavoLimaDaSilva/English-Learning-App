name: Deploy Firebase Cloud Functions

on:
  push:
    branches:
      - main # This workflow will run on every push to the 'main' branch.
              # You can change 'main' to your preferred default branch (e.g., 'master').
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

jobs:
  deploy_functions:
    runs-on: ubuntu-latest # Specifies the type of runner that the job will run on.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Action to check out your repository code.

      - name: Authenticate to Google Cloud
        id: 'auth' # Assigns an ID to this step so its outputs can be referenced.
        uses: 'google-github-actions/auth@v2' # Official Google action for authentication.
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Uses the secret you stored.

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Action to set up Node.js environment.
        with:
          node-version: '18' # IMPORTANT: Specify the Node.js version your Cloud Functions use.
                             # Ensure this matches your functions/package.json `engines` setting.

      - name: Install Firebase CLI
        run: npm install -g firebase-tools # Installs the Firebase Command Line Interface globally.

      - name: Install Cloud Functions dependencies
        # Navigate into your Cloud Functions directory (usually 'functions/')
        # and install the project dependencies.
        run: |
          cd functions/
          npm ci 

      # - name: Build Cloud Functions
        # If your functions require a build step (e.g., TypeScript compilation),
        # add it here. For example, if you have a `build` script in functions/package.json.
         #run: |
          # cd functions/
         #npm run build 
        # This step is commented out by default; uncomment if applicable to your project.

      - name: Deploy Cloud Functions to Firebase
        run: firebase deploy --only functions --project hope-2033a # Your Firebase Project ID
